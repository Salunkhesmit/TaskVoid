<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tasks · TASKVOID</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <link href="components.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html">
        <span class="brand-mark"><i class="fa-solid fa-cube"></i></span>
        <span>TASKVOID<small>focus · plan · ship</small></span>
      </a>
      <div class="nav-label">Workspace</div>
      <a class="nav-link" href="index.html"><i class="fa-solid fa-grid-2"></i>Overview</a>
      <a class="nav-link" href="tasks.html"><i class="fa-solid fa-list-check"></i>Tasks</a>
      <a class="nav-link" href="focus.html"><i class="fa-solid fa-hourglass-half"></i>Focus</a>
      <a class="nav-link" href="calendar.html"><i class="fa-solid fa-calendar-days"></i>Calendar</a>
      <a class="nav-link" href="analytics.html"><i class="fa-solid fa-chart-column"></i>Analytics</a>
      <div class="sidebar-bottom">
        <div class="d-flex align-items-center gap-2 mb-1">
          <i class="fa-solid fa-sparkles"></i>
          <strong>Make today count</strong>
        </div>
        <div class="tiny">Small progress, daily.</div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" data-mobile-menu aria-label="Toggle menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <div class="eyebrow">Tasks</div>
            <h1>All tasks</h1>
            <div class="subtitle">Everything in one place.</div>
          </div>
        </div>
        <div class="date-chip"><span data-current-date></span></div>
      </div>

      <section class="panel fade-in">
        <div class="panel-title">
          <div>
            <h2>Your task list</h2>
            <p>Capture it, prioritize it, get it done</p>
          </div>
          <span class="badge-soft" data-task-count>0 tasks</span>
        </div>

        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
          <div class="filter-row">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="pending">Pending</button>
            <button class="filter-chip" data-filter="completed">Completed</button>
          </div>
          <button class="btn btn-primary" data-open-task-modal>
            <i class="fa-solid fa-plus"></i> New task
          </button>
        </div>

        <div class="mb-3">
          <input class="form-control" id="taskSearch" placeholder="Search tasks or categories...">
        </div>

        <div data-task-list></div>
      </section>

      <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <form id="taskForm">
              <div class="modal-header">
                <h5 class="modal-title" id="taskModalTitle">Add task</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="taskId">
                <label class="form-label">Task title</label>
                <input class="form-control mb-3" id="taskTitle" placeholder="What needs to get done?" required maxlength="140">
                <div class="row g-3">
                  <div class="col-6">
                    <label class="form-label">Category</label>
                    <select class="form-select" id="taskCategory">
                      <option>College</option>
                      <option>Projects</option>
                      <option>Skills</option>
                      <option>Personal</option>
                      <option>General</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="form-label">Priority</label>
                    <select class="form-select" id="taskPriority">
                      <option value="medium">Medium</option>
                      <option value="high">High</option>
                      <option value="low">Low</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Due date</label>
                    <input class="form-control" id="taskDue" type="date">
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save task</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script src="tasks.js"></script>
</body>
</html>
